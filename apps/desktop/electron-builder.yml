# electron-builder 打包配置（Windows 独立应用：内嵌数据库与后台，打开即用）
appId: dev.aipeople.desktop
productName: EasyControl
executableName: EasyControl
artifactName: EasyControl-Setup-${version}.${ext}
copyright: Copyright 2026 clb (lamthebest@foxmail.com)

directories:
  output: release
  buildResources: resources

# 运行时需要的文件（相对本包根，进 asar）
files:
  - dist-renderer/**
  - electron/**
  - resources/icon.png
  - resources/tray.png
  - resources/LICENSE.txt
  - resources/NOTICE.txt
  - resources/icons-license.txt
  - resources/migrations/**
  - package.json

# 嵌入式 PGlite WASM 及自带 npm 客户端放入 asar 外资源目录。
extraResources:
  - from: resources/pglite
    to: pglite
  - from: resources/tool-runtime
    to: tool-runtime

asar: true
asarUnpack:
  - electron/speech.ps1

win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch:
        - x64
  # 无证书的本地打包：不签名，仅警告
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Easy Control
  perMachine: false
  runAfterFinish: false
  installerLanguages:
    - zh_CN




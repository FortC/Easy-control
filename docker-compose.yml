services:
  postgres:
    image: postgres:16-alpine
    container_name: aipeople-postgres
    environment:
      POSTGRES_USER: aipeople
      POSTGRES_PASSWORD: aipeople_dev
      POSTGRES_DB: aipeople
    ports:
      - "5433:5432"
    volumes:
      - aipeople_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipeople -d aipeople"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aipeople_pgdata:
